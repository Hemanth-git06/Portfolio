<style>
  :root {
    --bg: #07060B;
    --ink: #ECEAF6;
    --line: rgba(255,255,255,0.08);
  }
  html, body, #root { background: var(--bg); color: var(--ink); }
  body { font-family: 'Kanit', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .hero-heading{
    background: linear-gradient(180deg, #FFFFFF 0%, #8C84B5 55%, #4F4974 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .accent-heading{
    background: linear-gradient(115deg, #FFFFFF 0%, #C9C2FF 38%, #8C7BFF 70%, #FFB07A 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  /* Animated nebula backdrop */
  .nebula{
    position: fixed; inset:-10%; pointer-events:none; z-index:0;
    background:
      radial-gradient(60% 50% at 18% 22%, rgba(108,92,231,0.35) 0%, rgba(108,92,231,0) 60%),
      radial-gradient(50% 40% at 82% 28%, rgba(194,75,255,0.22) 0%, rgba(194,75,255,0) 60%),
      radial-gradient(70% 60% at 60% 90%, rgba(255,157,92,0.16) 0%, rgba(255,157,92,0) 60%),
      radial-gradient(40% 35% at 8% 80%, rgba(76,187,255,0.18) 0%, rgba(76,187,255,0) 60%);
    animation: drift 28s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%   { transform: translate3d(-2%, -1%, 0) scale(1); }
    100% { transform: translate3d(3%, 2%, 0) scale(1.05); }
  }
  .grid-veil{
    position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 75%);
  }
  /* GLASS */
  .glass{
    background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.025));
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.18),
      inset 0 -1px 0 rgba(255,255,255,0.04),
      0 24px 60px -20px rgba(0,0,0,0.6);
  }
  .glass-soft{
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    backdrop-filter: blur(14px) saturate(130%);
    -webkit-backdrop-filter: blur(14px) saturate(130%);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .glass-shine{
    position:absolute; inset:0; pointer-events:none; border-radius: inherit;
    background:
      radial-gradient(120% 60% at 0% 0%, rgba(255,255,255,0.18), transparent 50%),
      radial-gradient(120% 60% at 100% 100%, rgba(140,123,255,0.10), transparent 50%);
    mix-blend-mode: screen;
  }
  /* Orbit ring around portrait */
  .orbit{
    position:absolute; inset:-14%;
    border-radius:9999px;
    border: 1px dashed rgba(255,255,255,0.12);
    animation: spin 40s linear infinite;
  }
  .orbit::before{
    content:""; position:absolute; width:10px; height:10px; border-radius:9999px;
    background: #C9C2FF; top:-5px; left:50%; transform:translateX(-50%);
    box-shadow: 0 0 22px 4px rgba(140,123,255,0.6);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Buttons */
  .btn-primary{
    position:relative;
    background: linear-gradient(135deg, #6C5CE7 0%, #8C7BFF 35%, #C24BFF 70%, #FF9D5C 100%);
    color:white; border-radius: 9999px;
    padding: 14px 28px;
    font-weight:500; text-transform:uppercase; letter-spacing: 0.18em; font-size: 13px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.18), 0 18px 40px -10px rgba(108,92,231,0.55), inset 0 1px 0 rgba(255,255,255,0.5);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .btn-primary:hover{ transform: translateY(-1px); box-shadow: 0 0 0 1px rgba(255,255,255,0.28), 0 22px 50px -8px rgba(194,75,255,0.55), inset 0 1px 0 rgba(255,255,255,0.6); }
  .btn-ghost{
    border-radius:9999px; padding: 12px 22px;
    border:1px solid rgba(255,255,255,0.22);
    color: var(--ink); text-transform:uppercase; letter-spacing:0.18em; font-size: 12px;
    background: rgba(255,255,255,0.03);
    transition: background .2s ease, border-color .2s ease;
  }
  .btn-ghost:hover{ background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.4); }
  /* Tag pill */
  .pill{
    display:inline-flex; align-items:center; gap:8px;
    padding: 6px 12px; border-radius: 9999px;
    background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: rgba(255,255,255,0.78);
  }
  .pill .dot{ width:6px; height:6px; border-radius:9999px; background: #8C7BFF; box-shadow: 0 0 10px #8C7BFF; }
  /* Reveal */
  .reveal{ opacity:1; transform: none; transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
  .reveal.pre{ opacity:0; transform: translateY(24px); }
  .reveal.in{ opacity:1; transform: none; }
  /* Char reveal */
  .char{ transition: opacity .4s ease, color .4s ease; }
  /* Service rows */
  .svc-row{ border-top: 1px solid rgba(255,255,255,0.08); transition: background .3s ease; }
  .svc-row:last-child{ border-bottom: 1px solid rgba(255,255,255,0.08); }
  .svc-row:hover{ background: linear-gradient(90deg, rgba(140,123,255,0.06), transparent); }
  /* Cursor follower */
  .cursor-glow{
    position: fixed; width: 480px; height:480px; border-radius:9999px; pointer-events:none; z-index:1;
    background: radial-gradient(closest-side, rgba(140,123,255,0.18), rgba(140,123,255,0));
    transform: translate(-50%,-50%); transition: opacity .3s ease;
    mix-blend-mode: screen;
  }
  /* Scroll cue */
  .scroll-cue{ animation: cue 1.6s ease-in-out infinite; }
  @keyframes cue { 0%,100% { transform: translateY(0); opacity:.5;} 50% { transform: translateY(8px); opacity:1; } }
  /* Tweaks panel chrome */
  .tw-panel{ position: fixed; right: 16px; bottom: 16px; z-index: 60; width: 280px; }
  .tw-row{ display:flex; align-items:center; justify-content:space-between; gap: 10px; padding: 6px 0; }
  .tw-input[type="range"]{ accent-color:#8C7BFF; width: 130px; }
  /* Hero portrait halo (glass) */
  .portrait-frame{ position:relative; border-radius:9999px; overflow:visible; }
  .portrait-frame::before{
    content:""; position:absolute; inset:-22%;
    border-radius:9999px;
    background: radial-gradient(closest-side, rgba(140,123,255,0.55), transparent 70%);
    filter: blur(20px); z-index:-1;
  }
  .portrait-glass{
    position:absolute; inset:-12%;
    border-radius:9999px;
    background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.04));
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 30px 60px -10px rgba(0,0,0,0.6);
  }
  /* Rail mask for marquee */
  .rail-mask{
    -webkit-mask-image: linear-gradient(90deg, transparent, black 6%, black 94%, transparent);
            mask-image: linear-gradient(90deg, transparent, black 6%, black 94%, transparent);
  }
  /* Hide scrollbar in marquee */
  ::-webkit-scrollbar{ width: 10px; }
  ::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.08); border-radius: 8px;}

  /* ----- Skills Marquee ----- */
  .skills-track{
    display:flex; gap: 18px; width: max-content;
    animation: skillScroll 60s linear infinite;
    will-change: transform;
  }
  .skills-track:hover{ animation-play-state: paused; }
  @keyframes skillScroll {
    from { transform: translate3d(0,0,0); }
    to   { transform: translate3d(-25%, 0, 0); }
  }
  .skill-card{
    flex: 0 0 auto;
    width: 180px; height: 200px;
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 18px 40px -22px rgba(0,0,0,0.6);

    display:flex; align-items:center; justify-content:center;
    transition: transform .35s cubic-bezier(.2,.7,.2,1), border-color .35s ease, box-shadow .35s ease;
  }
  .skill-card:hover{
    transform: translateY(-6px) scale(1.04);
    border-color: rgba(255,255,255,0.28);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 30px 60px -22px rgba(140,123,255,0.6);
  }
  .skill-glow{
    position:absolute; inset:-30%;
    background: radial-gradient(closest-side, rgba(140,123,255,0.35), transparent 70%);
    opacity: 0; transition: opacity .35s ease;
    pointer-events:none;

  .skill-card:hover .skill-glow{ opacity: 1; }
  .skill-img-wrap{
    position: relative; z-index: 1;
    width: 88px; height: 88px;
    display:flex; align-items:center; justify-content:center;

  }
  .skill-card:hover .skill-img-wrap{ transform: translateY(-22px) scale(0.85); opacity: 0.9; }
  .skill-img{ max-width:100%; max-height:100%; object-fit: contain; }
  .skill-invert{ filter: brightness(0) invert(1) opacity(0.92); }
  .skill-label{
    position:absolute; left:0; right:0; bottom: 22px; text-align:center; padding: 0 12px;
    opacity: 0; transform: translateY(8px);
    transition: opacity .35s ease, transform .35s cubic-bezier(.2,.7,.2,1);
    pointer-events: none;
  }
  .skill-card:hover .skill-label{ opacity:1; transform: translateY(0); }

  /* ----- Category Cards ----- */
  .cat-card{
    --h: var(--cat-hue, 264);
    position: relative; display:block;
    border-radius: 28px;
    padding: 1px;
    background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.04));
    box-shadow: 0 30px 70px -30px rgba(0,0,0,0.7);
    overflow: hidden;
    transition: transform .35s cubic-bezier(.2,.7,.2,1);
  }
  .cat-card:hover{ transform: translateY(-6px); }
  .cat-glow{
    position:absolute; inset:-25%;
    background: radial-gradient(closest-side, hsl(var(--h) 90% 65% / 0.45), transparent 70%);
    opacity: 0.25; transition: opacity .4s ease;
    pointer-events:none;
  }
  .cat-card.is-active .cat-glow,
  .cat-card:hover .cat-glow{ opacity: 0.9; }
  .cat-inner{
    position: relative;
    border-radius: 27px;
    background: linear-gradient(180deg, rgba(20,16,40,0.85), rgba(10,8,22,0.92));
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    padding: 22px;
    min-height: 380px;
    display:flex; flex-direction: column;
  }
  .cat-icon-wrap{
    width: 120px; height: 120px;
    border-radius: 28px;
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 20px 50px -20px hsl(var(--h) 80% 55% / 0.55);
    display:flex; align-items:center; justify-content:center;
    transition: transform .4s cubic-bezier(.2,.7,.2,1);
  }
  .cat-card:hover .cat-icon-wrap{ transform: translateY(-4px) rotate(-3deg); }
  .cat-icon{ width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 4px 14px hsl(var(--h) 90% 70% / 0.45)); }
  .cat-arrow{
    display:inline-flex; align-items:center; justify-content:center;
    width: 36px; height: 36px; border-radius: 9999px;
    border: 1px solid rgba(255,255,255,0.18);
    color: white; transition: transform .3s ease, background .3s ease, border-color .3s ease;

  .cat-card:hover .cat-arrow{ background: hsl(var(--h) 80% 60% / 0.4); border-color: rgba(255,255,255,0.45); transform: translateX(4px); }

  /* Certifications view / lightbox */
  .cert-card .cert-view{
    position:absolute; inset:0; border:0; background:transparent; padding:0;
    display:flex; align-items:flex-start; justify-content:flex-end;
    opacity:0; transition:opacity .18s ease; pointer-events:none;
  }
  .cert-card:hover .cert-view{ opacity:1; }
  .cert-view-pill{
    pointer-events:auto; margin:10px; cursor:zoom-in;
    font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:#fff;
    background:rgba(10,8,20,0.72); border:1px solid rgba(255,255,255,0.18);
    padding:6px 12px; border-radius:9999px; backdrop-filter:blur(6px);
  }
  .cert-view-pill:hover{ background:rgba(10,8,20,0.9); border-color:rgba(255,255,255,0.35); }
  .cert-lightbox{
    position:fixed; inset:0; z-index:60; background:rgba(6,5,11,0.9);
    backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center;
    padding:5vh 5vw; cursor:zoom-out; animation:certfade .18s ease;
  }
  .cert-lightbox img{
    max-width:100%; max-height:100%; border-radius:12px;
    box-shadow:0 30px 90px rgba(0,0,0,0.6); cursor:default;
  }
  .cert-lightbox-close{
    position:fixed; top:22px; right:24px; color:#fff; cursor:pointer;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2);
    padding:8px 14px; border-radius:9999px;
    font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
  }
  .cert-lightbox-close:hover{ background:rgba(255,255,255,0.16); }
  @keyframes certfade{ from{opacity:0} to{opacity:1} }
</style>

<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">





const { useState, useEffect, useRef, useMemo } = React;

const TWEAKS = /*EDITMODE-BEGIN*/{
  "glassStrength": 22,
  "showOrbit": true,
  "showCursor": true
}/*EDITMODE-END*/;

/* ---------- Hooks & utils ---------- */
function useReveal() {
  useEffect(() => {
    const els = Array.from(document.querySelectorAll('.reveal'));
    els.forEach((el) => el.classList.add('pre'));
    const reveal = (el) => requestAnimationFrame(() => {el.classList.remove('pre');el.classList.add('in');});
    const check = () => {
      const vh = window.innerHeight;
      els.forEach((el) => {
        if (!el.classList.contains('pre')) return;
        const r = el.getBoundingClientRect();
        if (r.top < vh * 0.92 && r.bottom > 0) reveal(el);
      });
    };
    requestAnimationFrame(() => requestAnimationFrame(check));
    window.addEventListener('scroll', check, { passive: true });
    let io;
    try {
      io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {if (e.isIntersecting) {reveal(e.target);io.unobserve(e.target);}});
      }, { threshold: 0.05 });
      els.forEach((el) => io.observe(el));
    } catch (_) {}
    const t = setTimeout(() => {els.forEach((el) => {el.classList.remove('pre');el.classList.add('in');});}, 2000);
    return () => {if (io) io.disconnect();window.removeEventListener('scroll', check);clearTimeout(t);};
  }, []);
}

function useScroll() {
  const [y, setY] = useState(0);
  useEffect(() => {
    const onScroll = () => setY(window.scrollY);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return y;
}

/* Magnetic hover */
function Magnet({ children, strength = 4, padding = 120, className = "", style = {} }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;if (!el) return;
    let active = false;
    const onMove = (e) => {
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2,cy = r.top + r.height / 2;
      const dx = e.clientX - cx,dy = e.clientY - cy;
      const dist = Math.hypot(dx, dy);
      const max = Math.max(r.width, r.height) / 2 + padding;
      if (dist < max) {
        active = true;
        el.style.transition = 'transform 0.3s ease-out';
        el.style.transform = `translate3d(${dx / strength}px, ${dy / strength}px, 0)`;
      } else if (active) {
        active = false;
        el.style.transition = 'transform 0.6s ease-in-out';
        el.style.transform = 'translate3d(0,0,0)';
      }
    };
    window.addEventListener('mousemove', onMove);
    return () => window.removeEventListener('mousemove', onMove);
  }, [strength, padding]);
  return <div ref={ref} className={className} style={{ willChange: 'transform', ...style }}>{children}</div>;
}

/* Cursor glow */
function CursorGlow({ enabled }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;if (!el) return;
    const onMove = (e) => {el.style.left = e.clientX + 'px';el.style.top = e.clientY + 'px';};
    if (enabled) {
      window.addEventListener('mousemove', onMove);
      el.style.opacity = 1;
    } else {
      el.style.opacity = 0;
    }
    return () => window.removeEventListener('mousemove', onMove);
  }, [enabled]);
  return <div ref={ref} className="cursor-glow" />;
}

/* ---------- NAV ---------- */
function Nav() {
  const links = ['Work', 'About', 'Experience', 'Skills', 'Certs', 'Contact'];
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onS = () => setScrolled(window.scrollY > 12);
    window.addEventListener('scroll', onS, { passive: true });
    return () => window.removeEventListener('scroll', onS);
  }, []);
  return (
    <nav className={`fixed top-0 left-0 right-0 z-40 transition-all ${scrolled ? 'py-3' : 'py-5'}`}>
      <div className="mx-auto max-w-[1400px] px-6 md:px-10 flex items-center justify-between">
        <div className={`flex items-center gap-3 ${scrolled ? 'glass rounded-full px-4 py-2' : ''}`}>
          <div className="w-7 h-7 rounded-md relative" style={{
            background: 'conic-gradient(from 200deg, #6C5CE7, #C24BFF, #FF9D5C, #6C5CE7)',
            boxShadow: '0 0 20px rgba(140,123,255,0.5)'
          }}>
            <div className="absolute inset-[3px] rounded-[5px] bg-[#0a0814] flex items-center justify-center mono text-[10px] tracking-widest text-white/80">HY</div>
          </div>
          <div className="leading-tight">
            <div className="text-sm font-medium tracking-wide">Hemanth Yarramsetti</div>
            <div className="mono text-[10px] uppercase tracking-[0.18em] text-white/45">3D · XR · Game Dev</div>
          </div>
        </div>
        <div className={`hidden md:flex items-center gap-1 px-2 py-1 rounded-full ${scrolled ? 'glass' : ''}`}>
          {links.map((l) =>
          <a key={l} href={`#${l.toLowerCase()}`} className="px-4 py-2 text-sm uppercase tracking-[0.18em] text-white/75 hover:text-white transition-colors relative group">
              {l}
              <span className="absolute left-4 right-4 -bottom-0.5 h-px bg-gradient-to-r from-transparent via-violet-300 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></span>
            </a>
          )}
        </div>
        <a href="#contact" className="btn-ghost hidden sm:inline-flex">Let's talk</a>
      </div>
    </nav>);

}

/* ---------- HERO ---------- */
function Hero({ tweaks }) {
  return (
    <section id="top" className="relative min-h-screen flex flex-col px-5 sm:px-8 md:px-10 pt-28 pb-10">
      <div className="grid-veil"></div>

      <div className="flex-1 flex flex-col justify-center items-center text-center relative">
        <div className="reveal mb-6">
          <span className="pill"><span className="dot"></span> Cleveland, OH</span>
        </div>
        <h1 className="reveal accent-heading font-black uppercase leading-[0.9] tracking-tight" style={{
          textWrap: 'balance', fontSize: "80px"
        }}>
          3D Technical Artist<br />/ XR Dev
        </h1>
        <p className="reveal mt-8 max-w-xl text-white/70 text-base md:text-lg leading-relaxed" style={{ transitionDelay: '0.2s' }}>
          I build interactive worlds where shaders, gameplay and XR interaction meet turning ideas into experiences that feel responsive, tactile and alive.
        </p>

        {/* Portrait bar */}
        <div className="reveal mt-10 md:mt-14 flex items-center gap-6 md:gap-10" style={{ transitionDelay: '0.35s' }}>

function About() {
  const ref = useRef(null);
  const y = useScroll();
  const text = "Master's student in Computer Science at Cleveland State University with 4+ years of experience shaping interactive experiences across AR/VR, real-time rendering, and stylized 3D. I'm passionate about building immersive worlds where creativity meets engineering  from shader graphs and gameplay systems to XR interactions that feel intuitive, engaging, and alive. My work spans Unity, Unreal Engine, AR/VR simulations, and human-robot interaction research, with a focus on blending design, logic, and user experience to create meaningful digital experiences.";
  const chars = useMemo(() => text.split(''), []);
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    if (!ref.current) return;
    const r = ref.current.getBoundingClientRect();
    const start = window.innerHeight * 0.8;
    const end = window.innerHeight * 0.2;
    const total = r.height + (start - end);
    const traveled = Math.max(0, start - r.top);
    setProgress(Math.min(1, traveled / total));
  }, [y]);
  return (
    <section id="about" className="relative px-5 sm:px-8 md:px-10 py-32 md:py-44">

        </div>
      </div>
      <div className="hidden md:block absolute bottom-16 left-[10%] reveal">
        <div className="glass rounded-full w-24 h-24 relative flex items-center justify-center">
          <div className="glass-shine"></div>
          <div className="w-12 h-12 rounded-full" style={{ background: 'radial-gradient(circle at 30% 30%, #FFD08C, #FF9D5C 60%, #C24BFF)' }}></div>

          <div className="mono text-[10px] uppercase tracking-[0.2em] text-white/55">Years</div>

/* ---------- TWEAKS ---------- */
function Tweaks({ tweaks, setTweaks }) {
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || !e.data.type) return;
      if (e.data.type === '__activate_edit_mode') setOpen(true);
      if (e.data.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const persist = (patch) => {
    setTweaks((t) => ({ ...t, ...patch }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*');
  };
  if (!open) return null;
  return (
    <div className="tw-panel">
      <div className="glass rounded-2xl p-4 relative">
        <div className="glass-shine"></div>
        <div className="flex items-center justify-between mb-3">
          <div className="mono text-[11px] uppercase tracking-[0.2em] text-white/65">Tweaks</div>
          <button className="text-white/55 hover:text-white" onClick={() => {setOpen(false);window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');}}>✕</button>
        </div>
        <div className="tw-row">
          <span className="text-sm text-white/75">Glass blur</span>
          <input className="tw-input" type="range" min="6" max="40" value={tweaks.glassStrength} onChange={(e) => {
            const v = +e.target.value;
            document.documentElement.style.setProperty('--glass-blur', v + 'px');
            persist({ glassStrength: v });
          }} />
        </div>
        <div className="tw-row">
          <span className="text-sm text-white/75">Orbit ring</span>
          <input type="checkbox" checked={tweaks.showOrbit} onChange={(e) => persist({ showOrbit: e.target.checked })} />
        </div>
        <div className="tw-row">
          <span className="text-sm text-white/75">Cursor glow</span>
          <input type="checkbox" checked={tweaks.showCursor} onChange={(e) => persist({ showCursor: e.target.checked })} />
        </div>
      </div>
    </div>);

}

/* ---------- APP ---------- */
function App() {
  const [tweaks, setTweaks] = useState(TWEAKS);
  useReveal();
  useEffect(() => {
    document.documentElement.style.setProperty('--glass-blur', tweaks.glassStrength + 'px');
  }, [tweaks.glassStrength]);
  return (
    <div className="relative">
      <div className="nebula"></div>
      <CursorGlow enabled={tweaks.showCursor} />
      <Nav />
      <main className="relative z-10">
        <Hero tweaks={tweaks} />
        <SkillsMarquee />
        <About />
        <Experience />
        <Skills />
        <Projects />
        <Certifications />
        <Contact />
      </main>
      <Tweaks tweaks={tweaks} setTweaks={setTweaks} />
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
